- alias: "Lenovo Thermal Warning"
  trigger:
    - platform: numeric_state
      entity_id: sensor.processor_temperature
      above: 65
  action:
    - service: notify.persistent_notification
      data:
        title: "High Server Temperature"
        message: "The Lenovo is running hot ({{ states('sensor.processor_temperature') | round(1) }}°C)!"

  mode: restart
