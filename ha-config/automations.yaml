- alias: "Pantry Climate Alert"
  description: "Alert when the cold room is outside the grocery safety zone"
  trigger:
    - platform: numeric_state
      entity_id: sensor.pantry_air_temperature
      below: 5
      id: "too_cold"
      for: "00:05:00"  # Only alert if it's too cold for 5 continuous minutes
    - platform: numeric_state
      entity_id: sensor.pantry_air_temperature
      above: 12
      id: "too_warm"
  condition: []
  action:
    - service: notify.persistent_notification
      data:
        title: "Pantry Climate Warning"
        message: >
          {% set temp = states('sensor.pantry_air_temperature') | float(0) | round(1) %}
          {% if trigger.id == 'too_cold' %}
            Pantry is too cold ({{ temp }}°C)!
          {% else %}
            Pantry is too warm ({{ temp }}°C)!
          {% endif %}

- alias: "Lenovo Thermal Warning"
  trigger:
    - platform: numeric_state
      entity_id: sensor.processor_temperature
      above: 65
  action:
    - service: notify.persistent_notification
      data:
        title: "High Server Temperature"
        message: "The Lenovo is running hot ({{ states('sensor.processor_temperature') | round(1) }}°C)!"

  mode: restart
